name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22", "24"]
    defaults:
      run:
        working-directory: mcp

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and run unit/protocol tests
        run: npm test

  validate-schema:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate data files against schemas
        run: |
          npx ajv-cli@5 validate -s data/schema/monster.schema.json -d data/monsters.json
          npx ajv-cli@5 validate -s data/schema/condition.schema.json -d data/conditions.json
